openapi: 3.0.0

info:
  title: API Supermercado
  description: API REST para gerenciamento de produtos de um supermercado.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Ambiente Local

tags:
  - name: Produto
    description: Operações relacionadas aos produtos.

paths:
  /produto:
    post:
      tags:
        - Produto
      summary: Cadastrar produto
      description: Cadastra um novo produto.
      operationId: salvarProduto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoRequest'
      responses:
        '201':
          description: Produto criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags:
        - Produto
      summary: Listar produtos
      description: Retorna todos os produtos cadastrados.
      operationId: buscarTodos

      responses:
        '200':
          description: Lista de produtos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutoResponse'

  /produto/{id}:
    get:
      tags:
        - Produto
      summary: Buscar produto por ID
      description: Retorna um produto pelo seu identificador.
      operationId: buscarPorId

      parameters:
        - $ref: '#/components/parameters/IdProduto'

      responses:
        '200':
          description: Produto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'

        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Produto
      summary: Atualizar produto
      description: Atualiza os dados de um produto.
      operationId: alterarProduto

      parameters:
        - $ref: '#/components/parameters/IdProduto'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoUpdateRequest'

      responses:
        '200':
          description: Produto atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'

        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Produto
      summary: Excluir produto
      description: Remove um produto pelo seu identificador.
      operationId: deletarProduto

      parameters:
        - $ref: '#/components/parameters/IdProduto'

      responses:
        '204':
          description: Produto removido com sucesso.

        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:
    IdProduto:
      name: id
      in: path
      required: true
      description: Identificador do produto.
      schema:
        type: integer
        format: int64

  schemas:

    ProdutoRequest:
      type: object
      required:
        - descricao
        - lote
        - dataValidade
      properties:
        descricao:
          type: string
          example: Xampu
        lote:
          type: string
          example: 10LT
        dataValidade:
          type: string
          format: date
          example: "2026-12-30"

    ProdutoUpdateRequest:
      type: object
      required:
        - descricao
        - lote
        - dataValidade
      properties:
        descricao:
          type: string
          example: Xampu Premium
        lote:
          type: string
          example: 20LT
        dataValidade:
          type: string
          format: date
          example: "2026-12-30"
        dataCriacao:
          type: string
          format: date
          example: "2024-01-15"

    ProdutoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        descricao:
          type: string
          example: Xampu
        lote:
          type: string
          example: 10LT
        dataCriacao:
          type: string
          format: date
          example: "2024-05-10"
        dataValidade:
          type: string
          format: date
          example: "2026-12-30"

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Produto não encontrado.
        path:
          type: string
          example: /produto/1

  responses:

    BadRequest:
      description: Requisição inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Produto não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

spring:
  application:
    name: supermercado
  server:
    error:
      include-message: always
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=supermercado;encrypt=true;trustServerCertificate=true
    username: DEC(sa)
    password: ENC(M7H+eX3yXrC7gcvNTNVAoFZ9uA2HpH7ktI623svjxEC4WxSZuLwCdrOg8eg/hr+m)
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties.hibernate.dialect: org.hibernate.dialect.SQLServerDialect